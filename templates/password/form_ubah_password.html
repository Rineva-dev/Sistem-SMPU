{% extends "layout.html" %}
{% block content %}
<div class="card">
    <div class="card-header">
        <h4>Ubah Password: {{ guru.nama }}</h4>
    </div>
    <div class="card-body">
        <p>Username saat ini: <strong>{{ guru.akun.username }}</strong></p>
        <form method="POST">
            <div class="form-group">
                <label>Password Baru <span class="text-danger">*</span></label>
                <input type="password" name="password_baru" class="form-control" required minlength="6">
            </div>
            <div class="form-group">
                <label>Konfirmasi Password Baru <span class="text-danger">*</span></label>
                <input type="password" name="konfirmasi_password" class="form-control" required minlength="6">
            </div>
            <div class="form-actions mt-3">
                <a href="{{ url_for('data_guru.halaman_data_guru') }}" class="btn btn-secondary">Kembali</a>
                <button type="submit" class="btn btn-warning">Simpan Password Baru</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
