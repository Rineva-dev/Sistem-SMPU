{% extends "layout.html" %}
{% block title %}Edit Agenda Kegiatan{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/jabatan/kepsek/agenda.css') }}">
{% endblock %}

{% block content %}
<div class="container-fluid px-4 py-4">
    <div class="form-container">
        <h3 class="form-title">Edit Agenda Kegiatan</h3>

        <form method="POST">
            <div class="form-group">
                <label for="judul">Judul Kegiatan <span class="text-danger">*</span></label>
                <input type="text" id="judul" name="judul" class="form-control" value="{{ kegiatan.judul }}" required>
            </div>

            <div class="form-group">
                <label for="deskripsi">Deskripsi Kegiatan</label>
                <textarea id="deskripsi" name="deskripsi" class="form-control" rows="4">{{ kegiatan.deskripsi or '' }}</textarea>
            </div>

            <div class="form-row">
                <div class="form-col form-group">
                    <label for="tanggal_mulai">Tanggal & Waktu Mulai <span class="text-danger">*</span></label>
                    <div class="custom-date">
                        <input type="datetime-local" id="tanggal_mulai" name="tanggal_mulai" class="form-control" value="{{ kegiatan.tanggal_mulai.strftime('%Y-%m-%dT%H:%M') }}" required>
                    </div>
                </div>
                <div class="form-col form-group">
                    <label for="tanggal_selesai">Tanggal & Waktu Selesai</label>
                    <div class="custom-date">
                        <input type="datetime-local" id="tanggal_selesai" name="tanggal_selesai" class="form-control" value="{{ kegiatan.tanggal_selesai.strftime('%Y-%m-%dT%H:%M') if kegiatan.tanggal_selesai else '' }}">
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-col form-group">
                    <label for="lokasi">Lokasi / Tempat</label>
                    <input type="text" id="lokasi" name="lokasi" class="form-control" value="{{ kegiatan.lokasi or '' }}">
                </div>
                <div class="form-col form-group">
                    <label for="penanggung_jawab">Penanggung Jawab</label>
                    <input type="text" id="penanggung_jawab" name="penanggung_jawab" class="form-control" value="{{ kegiatan.penanggung_jawab or '' }}">
                </div>
            </div>

            <div class="form-group">
                <label for="status">Status Kegiatan</label>
                <select id="status" name="status" class="form-select">
                    <option value="otomatis" {{ 'selected' if kegiatan.status != 'Dibatalkan' }}>Sesuai Waktu (Otomatis)</option>
                    <option value="Dibatalkan" {{ 'selected' if kegiatan.status == 'Dibatalkan' }}>Dibatalkan</option>
                </select>
                <small class="text-muted">Status selain "Dibatalkan" akan berubah otomatis mengikuti waktu saat ini</small>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Perbarui Agenda</button>
                <a href="{{ url_for('agenda.daftar_agenda') }}" class="btn btn-cancel">Batal & Kembali</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
