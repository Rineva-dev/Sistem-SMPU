<div class="card">
    <div class="card-header">
        <h4>Ubah Password Akun Guru</h4>
    </div>
    <div class="card-body">
        <p>Mengubah password untuk: <strong>{{ guru.nama }}</strong></p>
        <p>Username saat ini: <strong>{{ guru.akun.username }}</strong></p>

        <form method="POST">
            <div class="form-group">
                <label>Password Baru <span class="text-danger">*</span></label>
                <input type="password" name="password_baru" class="form-input" required minlength="6">
            </div>
            <div class="form-group">
                <label>Konfirmasi Password Baru <span class="text-danger">*</span></label>
                <input type="password" name="konfirmasi_password" class="form-input" required minlength="6">
            </div>

            <div class="form-actions">
                <a href="{{ url_for('data_guru.halaman_data_guru') }}" class="btn btn-secondary">Kembali</a>
                <button type="submit" class="btn btn-primary">Simpan Password Baru</button>
            </div>
        </form>
    </div>
</div>
