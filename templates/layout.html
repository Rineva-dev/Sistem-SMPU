<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistem Informasi Sekolah{% endblock %}</title>

    <!-- Ikon & CSS Dasar -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css">

    <!-- CSS Utama Sistem -->
    <link rel="stylesheet" data-spa-global href="{{ url_for('static', filename='css/global.css') }}">
    <link rel="stylesheet" data-spa-global href="{{ url_for('static', filename='css/sidebar.css') }}">
    <link rel="stylesheet" data-spa-global href="{{ url_for('static', filename='css/header.css') }}">
    <link rel="stylesheet" data-spa-global href="{{ url_for('static', filename='css/btn.css') }}">
    <link rel="stylesheet" data-spa-global href="{{ url_for('static', filename='css/custom-select.css') }}">
    <link rel="stylesheet" data-spa-global href="{{ url_for('static', filename='css/custom-date.css') }}">
    <link rel="stylesheet" data-spa-global href="{{ url_for('static', filename='css/custom-time.css') }}">
    <link rel="stylesheet" data-spa-global href="{{ url_for('static', filename='css/editor_text_input.css') }}">

    <!-- ✅ CSS Notifikasi Global -->
    <link rel="stylesheet" data-spa-global href="{{ url_for('static', filename='css/notif.css') }}">
    <link rel="stylesheet" data-spa-global href="{{ url_for('static', filename='css/notif_custom.css') }}">
    <!-- Tempat tambahan CSS khusus per halaman -->
    {% block extra_css %}
    {% endblock %}
    
</head>
<body class="dashboard-page">
    <div class="app-container">

        <!-- Sidebar -->
        {% include "components/sidebar.html" %}

        <!-- Bagian Kanan: Header + Konten -->
        <div class="main-content">
            <!-- Header -->
            {% include "components/header.html" %}

            <!-- Konten Utama Halaman -->
            <div class="content-wrapper" id="spa-content">
                {% block content %}{% endblock %}
            </div>
        </div>

    </div>

    <!-- ✅ Komponen Data Pesan Flash -->
    {% include "components/notif.html" %}

    {% include "components/surat.html" %}

    <!-- Script Dasar -->
    <script data-spa-global src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script data-spa-global src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>

    <script data-spa-global src="{{ url_for('static', filename='js/custom-date.js') }}"></script>
    <script data-spa-global src="{{ url_for('static', filename='js/custom-time.js') }}"></script>
    <script data-spa-global src="{{ url_for('static', filename='js/custom-select.js') }}"></script>
    <script data-spa-global src="{{ url_for('static', filename='js/editor_text_input.js') }}"></script>

    <!-- ✅ JS Notifikasi Global -->
    <script data-spa-global src="{{ url_for('static', filename='js/notif.js') }}"></script>
    <script data-spa-global src="{{ url_for('static', filename='js/notif_custom.js') }}"></script>

    <!-- SPA Navigation -->
    <script data-spa-global src="{{ url_for('static', filename='js/spa-navigation.js') }}"></script>

    <!-- Tempat tambahan JS khusus per halaman -->
    {% block extra_js %}{% endblock %}
    
</body>
</html>
