<style>
/* ==============================================
   FORM KELAS — Gaya Modern Minimalis
============================================== */
/* Judul Halaman */
.page-heading {
    text-align: center;
}
.page-heading h4 {
    color: #1e293b;
}

/* Kartu Utama */
.card.border-0 {
    background: #ffffff;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
}
.card.border-0:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08) !important;
}

/* Input & Select — Gaya Lembut */
.custom-input,
.custom-select {
    border: 1.5px solid #e2e8f0;
    border-radius: 0.75rem;
    padding: 0.75rem 1rem;
    font-size: 0.98rem;
    background-color: #fcfdfe;
    transition: all 0.25s ease;
}
.custom-input:focus,
.custom-select:focus {
    border-color: #3b82f6;
    background-color: #ffffff;
    box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.12);
    outline: none;
}

/* Label */
.form-label.fw-medium {
    color: #334155;
    font-size: 0.92rem;
    margin-bottom: 0.5rem;
}

/* Tombol — Efek Halus */
.btn.rounded-pill {
    font-weight: 500;
    transition: all 0.25s ease;
    border: none;
}
.btn-primary.rounded-pill {
    background: linear-gradient(90deg, #3b82f6 0%, #2563eb 100%);
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
}
.btn-primary.rounded-pill:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(59, 130, 246, 0.35);
}
.btn-light.border.rounded-pill {
    background: #fcfdff;
    border-color: #e2e8f0 !important;
    border: 1px solid #bbbbbb!important;
}
.btn-light.border.rounded-pill:hover {
    background: #e7e7e7;
    border-color: #cbd5e1 !important;
}

/* Garis Pemisah dengan Teks */
hr {
    border-color: #e2e8f0;
    opacity: 1;
}

/* Responsif */
@media (max-width: 576px) {
    .card-body {
        padding: 2rem 1.25rem !important;
    }
    .btn.rounded-pill {
        padding: 0.6rem 1rem !important;
        font-size: 0.9rem;
    }
}
</style>

<div class="dashboard-container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9">
            <!-- Judul Halaman -->
            <div class="page-heading mb-4">
                <h4 class="fw-semibold mb-1">
                    <i class="fas fa-building text-primary me-2"></i>
                    {{ 'Ubah Data Kelas' if mode == 'ubah' else 'Tambah Kelas Baru' }}
                </h4>
                <p class="text-muted small mb-0">
                    Lengkapi informasi kelas pada formulir di bawah ini
                </p>
            </div>

            <!-- Kartu Form -->
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-4 p-sm-5">
                    <form method="POST">
                        <!-- Nama Kelas -->
                        <div class="mb-4">
                            <label class="form-label fw-medium text-dark">Nama Kelas <span class="text-danger">*</span></label>
                            <input type="text" 
                                   name="nama_kelas" 
                                   class="form-control form-control-lg custom-input" 
                                   required 
                                   placeholder="Contoh: Al-Majid, Al-Mukmin"
                                   value="{{ kelas.nama_kelas if kelas else '' }}">
                        </div>

                        <!-- Jenjang -->
                        <div class="mb-4">
                            <label class="form-label fw-medium text-dark">Jenjang / Tingkat <span class="text-danger">*</span></label>
                            <select name="jenjang" class="form-select form-select-lg custom-select" required>
                                <option value="">-- Pilih jenjang kelas --</option>
                                <option value="7" {{ 'selected' if kelas and kelas.jenjang == '7' else '' }}>Kelas 7</option>
                                <option value="8" {{ 'selected' if kelas and kelas.jenjang == '8' else '' }}>Kelas 8</option>
                                <option value="9" {{ 'selected' if kelas and kelas.jenjang == '9' else '' }}>Kelas 9</option>
                            </select>
                        </div>

                        <!-- Wali Kelas -->
                        <div class="mb-4">
                            <label class="form-label fw-medium text-dark">Wali Kelas</label>
                            <select name="wali_kelas_id" class="form-select form-select-lg custom-select">
                                <option value="">-- Belum ditentukan --</option>
                                {% for guru in daftar_guru %}
                                <option value="{{ guru.id }}" {{ 'selected' if kelas and kelas.wali_kelas_id == guru.id else '' }}>
                                    {{ guru.nama }}
                                </option>
                                {% endfor %}
                            </select>
                            <div class="form-text text-muted mt-1">
                                Pilih guru yang bertanggung jawab sebagai wali kelas
                            </div>
                        </div>

                        <!-- Garis Pemisah -->
                        <div class="d-flex align-items-center my-4">
                            <hr class="flex-grow-1">
                            <span class="px-3 small text-muted">Selesaikan</span>
                            <hr class="flex-grow-1">
                        </div>

                        <!-- Tombol Aksi -->
                        <div class="d-flex gap-3">
                            <button type="submit" class="btn btn-primary px-4 py-2 rounded-pill flex-grow-1">
                                <i class="fas fa-check-circle me-2"></i>Simpan Data
                            </button>
                            <a href="{{ url_for('data_kelas.halaman_daftar_kelas') }}" 
                               class="btn btn-light border px-4 py-2 rounded-pill flex-grow-1 text-dark">
                                <i class="fas fa-times me-2"></i>Batal
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
