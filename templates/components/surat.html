<!-- Tombol Mengambang & Panel Notifikasi Surat -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/surat.css') }}">

<!-- Tombol Utama -->
<button id="tombolSurat" class="tombol-surat-mengambang">
    <i class="fa fa-envelope"></i> Surat
    <span id="jumlahNotif" class="badge-notif" style="display: none;">0</span>
    <i class="fa fa-chevron-up ikon-panah"></i>
</button>

<!-- Panel Notifikasi -->
<div id="panelSurat" class="panel-surat">
    <div class="panel-header">
        <h6 class="mb-0"><i class="fa fa-envelope-open-text me-2"></i>Daftar Surat</h6>
        <button type="button" class="btn-close btn-sm" onclick="tutupPanelSurat()"></button>
    </div>
    <div class="panel-nav">
        <button class="tab-surat active" data-target="perlu">Perlu Persetujuan</button>
        <button class="tab-surat" data-target="disetujui">Sudah Ditandatangani</button>
        <button class="tab-surat" data-target="lainnya">Lainnya</button>
    </div>
    <div class="panel-isi" id="kontenPanelSurat">
        <div class="text-center p-4 text-muted">Memuat data...</div>
    </div>
</div>

<!-- GANTI MODAL INI -->
<div class="modal fade" id="modalDetailSurat" tabindex="-1" aria-labelledby="judulModalSurat" aria-hidden="true">
    <div class="modal-dialog modal-xl"> <!-- Ubah dari modal-lg-custom menjadi modal-xl -->
        <div class="modal-content">
            <div class="modal-header border-bottom"> <!-- Tambah kelas border-bottom -->
                <h5 class="modal-title" id="judulModalSurat">Pemeriksaan Surat</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
            </div>

            <div class="modal-body"> <!-- Hapus id="isiDetailSurat" dari sini -->
                <div id="isiDetailSurat"></div> <!-- Pindahkan id ke dalam div baru -->
            </div>

            <div class="modal-footer border-top" id="aksiSuratFooter" style="display: none;"> <!-- Tambah kelas border-top -->
                <textarea id="catatanPersetujuan" class="form-control" placeholder="Tulis catatan atau alasan (jika diperlukan)"></textarea>
                <div class="tombol-aksi">
                    <button type="button" class="btn btn-warning" onclick="prosesTindakan('perbaiki')">
                        <i class="fa fa-pencil-alt me-1"></i> Minta Perbaikan
                    </button>
                    <button type="button" class="btn btn-danger" onclick="prosesTindakan('tolak')">
                        <i class="fa fa-ban me-1"></i> Tolak Surat
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const GURU_ID_SAYA = {{ session.guru_id | default(0) }};
</script>

<script src="{{ url_for('static', filename='js/surat.js') }}"></script>
